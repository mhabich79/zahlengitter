# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title: Zahlengitter
description: Bewege dich im Hunderterfeld von einer Zahl zur anderen – links, rechts, oben und unten.
howto: |
  - Tippe auf die Pfeile oder drücke die Pfeiltasten, um dich im Hunderterfeld zu bewegen.
  - Starte bei der grün markierten Zahl und finde den Weg zur orange markierten Zielzahl.
  - Leicht: nur eine Richtung. Mittel: kombinierte Wege. Schwer: finde den Rückweg.
competencies:
  - Ich kann mich im Hunderterfeld nach links und rechts bewegen.
  - Ich kann mich im Hunderterfeld nach oben und unten bewegen.
  - Ich kann kombinierte Wege im Hunderterfeld finden.
  - Ich kann Umkehraufgaben im Hunderterfeld lösen.
languages: [de]
routes:
  - id: leicht
    title: Leicht
    description: Nur eine Richtung – links/rechts oder oben/unten.
  - id: mittel
    title: Mittel
    description: Kombinierte Wege – beide Richtungen zusammen.
  - id: schwer
    title: Schwer
    description: Finde den Rückweg – Umkehraufgaben.
